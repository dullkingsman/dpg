name: Release / Grammar

on:
  push:
    tags:
      - 'grammar-v[0-9]*.[0-9]*.[0-9]*'
  workflow_call:
    inputs:
      tag:
        description: 'grammar-v* tag to release (e.g. grammar-v0.1.0)'
        required: true
        type: string

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  resolve-meta:
    name: Resolve tag metadata
    runs-on: ubuntu-latest
    outputs:
      tag:        ${{ steps.meta.outputs.tag }}
      version:    ${{ steps.meta.outputs.version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - name: Resolve
        id: meta
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          VERSION="${TAG#grammar-v}"
          echo "tag=$TAG"         >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          if [[ "$VERSION" == *-* ]]; then
            echo "prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "prerelease=false" >> $GITHUB_OUTPUT
          fi

  generate:
    name: Generate parser
    needs: resolve-meta
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: lang/grammar/package.json

      - name: Install dependencies
        working-directory: lang/grammar
        run: npm install

      - name: Generate parser
        working-directory: lang/grammar
        run: npx tree-sitter generate

      - uses: actions/upload-artifact@v4
        with:
          name: grammar-src
          path: lang/grammar/src/
          if-no-files-found: error

  # GitHub Release — uploads parser.c and node-types.json as pinned assets.
  # Helix and other tools that clone the grammar can pin to a grammar-v* tag.
  release:
    name: Create GitHub Release
    needs: [resolve-meta, generate]
    runs-on: ubuntu-latest

    steps:
      - name: Download generated parser
        uses: actions/download-artifact@v4
        with:
          name: grammar-src
          path: grammar-src/

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve-meta.outputs.tag }}
          draft: false
          prerelease: ${{ needs.resolve-meta.outputs.prerelease }}
          generate_release_notes: true
          files: |
            grammar-src/parser.c
            grammar-src/scanner.c
            grammar-src/node-types.json

  # Publishes tree-sitter-dpg to npm via OIDC trusted publishing (no stored
  # token). The trusted-publisher entry on npmjs.com is keyed to a single
  # workflow FILENAME, and npm (unlike crates.io) allows only one such entry
  # per package. That entry is currently set to `release.yml`, because this
  # job runs as a reusable workflow called from release.yml during a normal
  # `v*` release cascade — GitHub's OIDC token identifies the job by the
  # *calling* workflow file in that case, not this one.
  #
  # If you push a `grammar-v*` tag directly (a grammar-only release, with no
  # `v*` cascade), this job runs standalone and the OIDC token's workflow
  # identity is `release-grammar.yml` instead — which will NOT match the
  # `release.yml` entry and the publish will fail with a 404.
  #
  # To do a grammar-only release: on npmjs.com → tree-sitter-dpg → Trusted
  # Publisher settings, temporarily change the workflow filename to
  # `release-grammar.yml`, push the `grammar-v*` tag, confirm the publish
  # succeeds, then change it back to `release.yml` so the next full `v*`
  # release keeps working. (crates.io doesn't have this limitation — it has
  # separate trusted-publisher entries for both `release.yml` and
  # `release-grammar.yml` registered at once.)
  publish-npm:
    name: Publish to npm
    needs: [resolve-meta, generate]
    runs-on: ubuntu-latest
    permissions:
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          cache: npm
          cache-dependency-path: lang/grammar/package.json

      - name: Download generated parser
        uses: actions/download-artifact@v4
        with:
          name: grammar-src
          path: lang/grammar/src/

      - name: Stamp version
        working-directory: lang/grammar
        run: npm version "${{ needs.resolve-meta.outputs.version }}" --no-git-tag-version

      - name: Install dependencies
        working-directory: lang/grammar
        run: npm install

      - name: Ensure npm supports OIDC trusted publishing (>=11.5.1)
        run: npm install -g npm@latest

      - name: Publish
        working-directory: lang/grammar
        run: |
          NPM_TAG="latest"
          if [[ "${{ needs.resolve-meta.outputs.prerelease }}" == "true" ]]; then
            NPM_TAG="alpha"
          fi
          output=$(npm publish --access public --provenance --tag "$NPM_TAG" 2>&1) && echo "$output" || {
            echo "$output"
            echo "$output" | grep -qE 'already exists|cannot publish over'
          }

  publish-crate:
    name: Publish to crates.io
    needs: resolve-meta
    runs-on: ubuntu-latest
    permissions:
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Stamp version
        working-directory: lang/grammar
        run: sed -i "s/^version = .*/version = \"${{ needs.resolve-meta.outputs.version }}\"/" Cargo.toml

      - uses: rust-lang/crates-io-auth-action@v1
        id: auth

      - name: Publish
        working-directory: lang/grammar
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          output=$(cargo publish --allow-dirty 2>&1) && echo "$output" || {
            echo "$output"
            echo "$output" | grep -q 'already exists on crates.io index'
          }

  build-wheels:
    name: Build Python wheels (${{ matrix.os }})
    needs: resolve-meta
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Stamp version
        working-directory: lang/grammar
        shell: bash
        run: |
          sed -i.bak "s/^version = .*/version = \"${{ needs.resolve-meta.outputs.version }}\"/" pyproject.toml
          rm -f pyproject.toml.bak

      - name: Build wheels
        uses: pypa/cibuildwheel@v2.21
        with:
          package-dir: lang/grammar
          output-dir: dist/

      - uses: actions/upload-artifact@v4
        with:
          name: dist-wheels-${{ matrix.os }}
          path: dist/

  build-sdist:
    name: Build source distribution
    needs: resolve-meta
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Stamp version
        working-directory: lang/grammar
        run: sed -i "s/^version = .*/version = \"${{ needs.resolve-meta.outputs.version }}\"/" pyproject.toml

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build sdist
        working-directory: lang/grammar
        run: |
          pip install build
          python -m build --sdist --outdir ../../dist/

      - uses: actions/upload-artifact@v4
        with:
          name: dist-sdist
          path: dist/

  upload-pypi:
    name: Upload to PyPI
    needs: [build-wheels, build-sdist]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          password: ${{ secrets.PYPI_TOKEN }}
          skip-existing: true
